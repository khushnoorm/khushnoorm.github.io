<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>पढ़ाई खोजें | Khushnoor</title><meta name="description" content="कक्षाएँ, विषय, अध्याय, नोट्स, प्रश्न और टेस्ट खोजें।"><meta name="robots" content="noindex,follow"><link rel="stylesheet" href="assets/styles.css"></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">K</span>Khush<em>noor</em></a><div class="nav-actions"><button class="icon-btn" id="themeBtn" onclick="toggleTheme()">🌙</button></div></div></header><main><section class="page-hero"><div class="container"><div class="breadcrumbs"><a href="index.html">होम</a> / खोज</div><h1>आप क्या पढ़ना चाहते हैं?</h1><div class="search-box"><span style="padding:12px">⌕</span><input id="searchInput" aria-label="खोजें" placeholder="अध्याय, विषय, नोट्स या टेस्ट…"><button class="btn btn-primary" onclick="runSearch()">खोजें</button></div><div class="meta" id="recent"></div></div></section><section style="padding-top:0"><div class="container"><div id="results" class="grid grid-2"></div></div></section></main><script src="assets/app.js"></script><script>const inp=document.getElementById('searchInput'),out=document.getElementById('results');inp.value=new URLSearchParams(location.search).get('q')||'';function runSearch(){const q=inp.value.trim();history.replaceState({},'',q?'?q='+encodeURIComponent(q):'search.html');if(q){let r=JSON.parse(localStorage.getItem('recentSearches')||'[]');r=[q,...r.filter(x=>x!==q)].slice(0,4);localStorage.setItem('recentSearches',JSON.stringify(r))}render()}function render(){const q=inp.value.toLowerCase().trim(),hits=q?CONTENT.filter(x=>(x.title+x.type+x.meta+x.keys).toLowerCase().includes(q)):CONTENT;out.innerHTML=hits.length?hits.map(x=>`<a class="card" href="${x.url}"><span class="badge">${x.type}</span><h3>${x.title}</h3><p>${x.meta}</p><div class="meta">खोलें →</div></a>`).join(''):`<div class="card empty"><div class="card-icon">⌕</div><h2>कोई परिणाम नहीं मिला</h2><p>शब्द की वर्तनी जाँचें या “गणित”, “कक्षा 9”, “बल” जैसा छोटा शब्द खोजें।</p></div>`;document.getElementById('recent').innerHTML=(JSON.parse(localStorage.getItem('recentSearches')||'[]')).map(x=>`<button class="btn btn-ghost" onclick="inp.value='${x}';render()">${x}</button>`).join('')}inp.addEventListener('keydown',e=>e.key==='Enter'&&runSearch());render()</script></body></html>
